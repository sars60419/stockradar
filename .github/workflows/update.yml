
name: Update StockRadar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python scripts/collect_data.py --start "$(date +%Y)-01-01" --end yesterday --out-dir docs/data --config-dir config --cache-dir .cache
      - run: |
          git config user.name "stockradar-bot"
          git config user.email "stockradar-bot@users.noreply.github.com"
          git add docs/data config .cache
          git commit -m "Update StockRadar data" || echo "No changes"
          git push

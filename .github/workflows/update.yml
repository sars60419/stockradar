name: Update StockRadar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Run collector - fast first run
        run: python scripts/collect_data.py --start "$(date -u -d '12 days ago' +%Y-%m-%d)" --end yesterday --out-dir docs/data --config-dir config --cache-dir .cache
      - run: |
          git config user.name "stockradar-bot"
          git config user.email "stockradar-bot@users.noreply.github.com"
          git add docs/data config .cache
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update StockRadar data"
          git pull --rebase origin main
          git push origin main
